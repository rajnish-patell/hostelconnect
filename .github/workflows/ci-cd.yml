name: HostelConnect CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-web-dashboard:
    name: Build & Verify Web Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dashboard Dependencies
        run: |
          cd web-dashboard
          npm install --legacy-peer-deps --no-audit

      - name: Build Web Dashboard Production Bundle
        run: |
          cd web-dashboard
          npm run build

  build-backend:
    name: Verify Backend & Prisma Schema
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/hostelconnect?schema=public"
      JWT_SECRET: "ci-pipeline-jwt-secret-key-123456789"
      SUPERADMIN_EMAIL: "patelrajnish47@gmail.com"
      PORT: 4000
      NODE_ENV: "test"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install --legacy-peer-deps --no-audit

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate

      - name: Run Backend Unit Tests
        run: |
          cd backend
          npm test

      - name: Build Backend Production Bundle
        run: |
          cd backend
          npm run build
